<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F0E4">
  <meta name="color-scheme" content="light">
  <title>小排 · 第 6 周</title>
  <style>
    :root {
      --paper: #faf6ee;
      --paper-bright: #fffbf4;
      --canvas: #e7d8c4;
      --ink: #3b2a1d;
      --ink-soft: #6f5742;
      --ink-muted: #7c634c;
      --ink-faint: #977f68;
      --line-v: rgba(143, 112, 77, 0.18);
      --line-hour: rgba(143, 112, 77, 0.24);
      --line-half: rgba(143, 112, 77, 0.12);
      --accent: #a95034;
      --accent-deep: #8c3e27;
      --accent-soft: #c47451;
      --honey: #f2ddbb;
      --honey-deep: #e7c99d;
      --sage: #dfe6d1;
      --sage-deep: #c8d4b5;
      --overdue: #a43d2b;
      --overdue-bg: #fbe9e2;
      --hour-height: 44px;
      --grid-height: 572px;
      --time-gutter: 37px;
      --tabbar-height: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sheet-ease: cubic-bezier(0.22, 0.8, 0.28, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--canvas);
      background-image:
        radial-gradient(circle at 14% 8%, rgba(255, 249, 240, 0.92), transparent 34%),
        radial-gradient(circle at 86% 88%, rgba(223, 200, 173, 0.75), transparent 38%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      margin: 0;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--paper);
    }

    .app-content {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .app-header {
      position: relative;
      z-index: 2;
      flex: none;
      background:
        radial-gradient(120% 130% at 82% -22%, rgba(255, 255, 255, 0.78), transparent 58%),
        linear-gradient(180deg, #f5e2c9 0%, #f9f0e4 60%, var(--paper) 100%);
    }

    .app-header::before {
      content: "";
      position: absolute;
      top: -76px;
      right: -24px;
      width: 210px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 236, 205, 0.84), transparent 70%);
      pointer-events: none;
    }

    .status-bar {
      position: relative;
      z-index: 1;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 21px;
      color: var(--ink);
    }

    .status-time {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.82;
    }

    .status-icons svg {
      display: block;
    }

    .battery {
      position: relative;
      width: 22px;
      height: 11px;
      padding: 1.5px;
      border: 1.2px solid currentColor;
      border-radius: 3.4px;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -3.2px;
      width: 2px;
      height: 4px;
      border-radius: 0 2px 2px 0;
      background: currentColor;
      opacity: 0.6;
    }

    .battery__fill {
      display: block;
      width: 53%;
      height: 100%;
      border-radius: 1.5px;
      background: currentColor;
    }

    .battery__text {
      margin-left: 1px;
      font-size: 9px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .week-row {
      position: relative;
      z-index: 1;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .week-sun {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      color: #bb6842;
    }

    .week-title {
      display: flex;
      align-items: baseline;
      gap: 3px;
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .week-title strong {
      font-size: 24px;
      line-height: 1;
      font-weight: 680;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .date-strip {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--time-gutter) repeat(7, minmax(0, 1fr));
      height: 54px;
    }

    .date-spacer {
      min-width: 0;
    }

    .day-cell {
      position: relative;
      display: flex;
      min-width: 0;
      margin: 1px 2px 3px;
      border-radius: 12px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background-color 160ms ease;
    }

    .day-cell::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 7px;
      width: 0;
      height: 0;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-top: 3.5px solid currentColor;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 160ms ease,
        transform 160ms ease;
    }

    .day-cell:not(.is-today):hover {
      background: rgba(169, 80, 52, 0.07);
    }

    .day-cell:hover::after,
    .day-cell:focus-visible::after,
    .day-cell.is-expanded::after {
      opacity: 0.5;
    }

    .day-cell.is-expanded::after {
      transform: rotate(180deg);
    }

    .day-date {
      font-size: 11px;
      font-weight: 620;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .day-weekday {
      font-size: 10px;
      line-height: 1.2;
      color: var(--ink-muted);
    }

    .day-ddl-badge {
      position: absolute;
      bottom: 1px;
      display: grid;
      min-width: 12px;
      height: 12px;
      padding: 0 3px;
      place-items: center;
      border-radius: 999px;
      background: rgba(139, 104, 72, 0.14);
      color: #77563a;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .day-cell.is-today {
      background: linear-gradient(180deg, #b85d3e 0%, #a74c31 100%);
      box-shadow: 0 5px 12px rgba(124, 61, 37, 0.18);
    }

    .day-cell.is-today .day-date,
    .day-cell.is-today .day-weekday {
      color: #fff8ee;
    }

    .day-cell.is-today .day-weekday {
      opacity: 0.82;
    }

    .day-cell.is-today::after {
      border-top-color: #fff8ee;
    }

    .day-cell.is-today .day-ddl-badge {
      background: rgba(255, 246, 235, 0.94);
      box-shadow: 0 1px 2px rgba(87, 42, 24, 0.16);
      color: var(--accent-deep);
    }

    .day-cell.has-overdue-ddl .day-ddl-badge {
      background: var(--overdue-bg);
      color: var(--overdue);
    }

    .day-ddl-panel {
      position: relative;
      z-index: 1;
      margin: 2px 12px 10px;
      padding: 10px 12px 11px;
      border: 1px solid rgba(169, 134, 96, 0.26);
      border-radius: 14px;
      background: rgba(255, 250, 242, 0.9);
      box-shadow: 0 8px 22px rgba(103, 68, 39, 0.06);
      backdrop-filter: blur(12px);
      animation: day-panel-in 180ms ease both;
    }

    .day-ddl-panel__head {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 16px;
      margin-bottom: 7px;
    }

    .day-ddl-panel__title {
      margin: 0;
      color: var(--ink);
      font-size: 11px;
      font-weight: 680;
      letter-spacing: 0.01em;
    }

    .day-ddl-panel__count {
      display: grid;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      place-items: center;
      border-radius: 999px;
      background: var(--accent);
      color: #fff7ed;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .day-ddl-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .day-ddl-row {
      width: 100%;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
      border-radius: 8px;
      text-align: left;
      transition: background-color 150ms ease;
    }

    .day-ddl-row:hover {
      background: rgba(169, 80, 52, 0.06);
    }

    .day-ddl-row__dot {
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    .day-ddl-row--overdue .day-ddl-row__dot {
      background: var(--overdue);
    }

    .day-ddl-row--today .day-ddl-row__dot {
      background: var(--accent);
    }

    .day-ddl-row__time {
      flex: none;
      min-width: 30px;
      color: var(--ink-muted);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .day-ddl-row--overdue .day-ddl-row__time {
      color: var(--overdue);
    }

    .day-ddl-row--today .day-ddl-row__time {
      color: var(--accent);
    }

    .day-ddl-row__title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .day-ddl-row__chevron {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--ink-faint);
    }

    .day-ddl-row__chevron svg {
      display: block;
      width: 12px;
      height: 12px;
    }

    .day-ddl-empty {
      margin: 0;
      padding: 3px 6px 2px;
      color: var(--ink-muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .timetable-scroll {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding-bottom: 88px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--paper);
      scrollbar-width: none;
    }

    .timetable-scroll::-webkit-scrollbar {
      display: none;
    }

    .app.is-sheet-open .timetable-scroll,
    .app.is-sheet-open .todo-scroll {
      overflow: hidden;
    }

    .app.is-todo .week-row,
    .app.is-todo .date-strip,
    .app.is-todo .day-ddl-panel {
      display: none;
    }

    .todo-view {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    .todo-header {
      flex: none;
      padding: 8px 22px 15px;
      background:
        radial-gradient(90% 160% at 88% -30%, rgba(255, 255, 255, 0.72), transparent 62%),
        linear-gradient(180deg, #f8ecdc 0%, var(--paper) 100%);
    }

    .todo-eyebrow {
      margin: 0 0 6px;
      color: var(--ink-muted);
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    .todo-title {
      margin: 0;
      color: var(--ink);
      font-size: 27px;
      font-weight: 760;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .todo-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 7px 0 0;
      color: var(--ink-muted);
      font-size: 11.5px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }

    .todo-summary.is-overdue::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--overdue);
    }

    .todo-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 18px 88px;
      scrollbar-width: none;
    }

    .todo-scroll::-webkit-scrollbar {
      display: none;
    }

    .todo-groups {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .todo-group__heading {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 2px 8px;
      color: var(--ink-muted);
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.07em;
      line-height: 1.2;
    }

    .todo-group__count {
      display: inline-grid;
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      place-items: center;
      border-radius: 999px;
      background: rgba(143, 112, 77, 0.1);
      color: var(--ink-soft);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .todo-group--overdue .todo-group__heading {
      color: var(--overdue);
    }

    .todo-group--overdue .todo-group__count {
      background: var(--overdue-bg);
      color: var(--overdue);
    }

    .todo-group--today .todo-group__heading {
      color: var(--accent);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 60px;
      padding: 12px 11px 12px 12px;
      border: 1px solid rgba(143, 112, 77, 0.16);
      border-radius: 15px;
      background: var(--paper-bright);
      box-shadow: 0 5px 16px rgba(72, 48, 26, 0.035);
    }

    .todo-item--overdue {
      border-color: rgba(164, 61, 43, 0.22);
      background: linear-gradient(180deg, #fffaf3 0%, #fdf0e9 100%);
    }

    .todo-item--today {
      border-color: rgba(169, 80, 52, 0.24);
    }

    .todo-check {
      position: relative;
      flex: none;
      width: 26px;
      height: 26px;
      margin-top: 4px;
      display: grid;
      place-items: center;
      border: 1.5px solid rgba(143, 112, 77, 0.36);
      border-radius: 50%;
      background: var(--paper-bright);
      color: var(--accent);
      transition:
        border-color 150ms ease,
        background-color 150ms ease,
        transform 150ms ease;
    }

    .todo-check::after {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
    }

    .todo-check svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transform: scale(0.82);
      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }

    .todo-check:hover svg,
    .todo-check:focus-visible svg {
      opacity: 0.55;
      transform: none;
    }

    .todo-check:hover,
    .todo-check:focus-visible {
      border-color: var(--accent);
      background: #fff8ee;
    }

    .todo-check:active {
      transform: scale(0.92);
    }

    .todo-item__body {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      text-align: left;
    }

    .todo-item__copy {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .todo-item__title {
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .todo-item__meta {
      color: var(--ink-muted);
      font-size: 10.5px;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    .todo-item--overdue .todo-item__meta {
      color: var(--overdue);
      font-weight: 650;
    }

    .todo-item--today .todo-item__meta {
      color: var(--accent);
      font-weight: 650;
    }

    .todo-item__chevron {
      flex: none;
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      color: var(--ink-faint);
      opacity: 0.62;
    }

    .todo-item__chevron svg {
      width: 14px;
      height: 14px;
    }

    .todo-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 46px 20px 0;
      text-align: center;
    }

    .todo-empty__icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 15px;
      place-items: center;
      border-radius: 50%;
      background: var(--sage);
      color: #5f6a49;
      box-shadow: 0 8px 20px rgba(87, 96, 63, 0.1);
    }

    .todo-empty__icon svg {
      width: 27px;
      height: 27px;
    }

    .todo-empty__title {
      margin: 0 0 5px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .todo-empty__copy {
      margin: 0 0 18px;
      color: var(--ink-muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .todo-empty__button {
      height: 40px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(124, 59, 35, 0.2);
      color: #fff8ee;
      font-size: 12.5px;
      font-weight: 650;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-gutter) minmax(0, 1fr);
      height: var(--grid-height);
    }

    .time-rail {
      position: relative;
    }

    .time-label {
      position: absolute;
      right: 7px;
      transform: translateY(-50%);
      color: var(--ink-muted);
      font-size: 9px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .time-label--first {
      top: 4px !important;
      transform: none;
    }

    .time-label--last {
      top: calc(var(--grid-height) - 4px) !important;
      transform: translateY(-100%);
    }

    .week-grid {
      position: relative;
      height: 100%;
    }

    .grid-lines {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
    }

    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid var(--line-hour);
    }

    .grid-line--half {
      border-top-style: dashed;
      border-top-color: var(--line-half);
    }

    .week-days {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      height: 100%;
    }

    .day-column {
      position: relative;
      height: 100%;
      border-left: 1px solid var(--line-v);
      cursor: pointer;
    }

    .day-column:last-child {
      border-right: 1px solid var(--line-v);
    }

    .day-column.is-today {
      background: linear-gradient(180deg, rgba(244, 216, 179, 0.36), rgba(250, 246, 238, 0) 72%);
    }

    .schedule-block {
      position: absolute;
      z-index: 2;
      left: 3px;
      right: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      padding: 5px 4px;
      border: 1px solid rgba(153, 112, 66, 0.12);
      border-radius: 10px;
      background: linear-gradient(155deg, #f6e5ca 0%, #f0d8b4 100%);
      box-shadow:
        0 1px 1px rgba(98, 67, 39, 0.05),
        inset 0 1px rgba(255, 255, 255, 0.42);
      color: #4b3420;
      text-align: center;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        filter 160ms ease;
      animation: block-in 320ms both;
      animation-delay: calc(var(--order, 0) * 18ms);
    }

    .schedule-block:hover {
      z-index: 3;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(109, 73, 39, 0.14);
      filter: saturate(1.03);
    }

    .schedule-block:active {
      transform: scale(0.985);
    }

    .schedule-block--event {
      border-color: rgba(102, 123, 74, 0.14);
      background: linear-gradient(155deg, #e7edd9 0%, #dce5cc 100%);
      color: #43502f;
    }

    .schedule-block__title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: 0.005em;
      text-wrap: balance;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .schedule-block__location {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      color: rgba(86, 60, 34, 0.76);
      font-size: 9px;
      line-height: 1.18;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .schedule-block--event .schedule-block__location {
      color: rgba(63, 77, 42, 0.78);
    }

    .schedule-block--short .schedule-block__location,
    .schedule-block--medium .schedule-block__location {
      display: none;
    }

    .fab {
      position: absolute;
      z-index: 7;
      right: 18px;
      bottom: calc(var(--tabbar-height) + var(--safe-bottom) + 16px);
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #b45b3d 0%, #9a442c 100%);
      box-shadow:
        0 11px 24px rgba(124, 59, 35, 0.28),
        0 2px 4px rgba(124, 59, 35, 0.16);
      color: #fff8ee;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .fab:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 28px rgba(124, 59, 35, 0.31),
        0 3px 5px rgba(124, 59, 35, 0.16);
    }

    .fab:active {
      transform: scale(0.96);
    }

    .fab svg {
      width: 21px;
      height: 21px;
    }

    .tabbar {
      position: relative;
      z-index: 5;
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      height: calc(var(--tabbar-height) + var(--safe-bottom));
      padding: 7px 12px var(--safe-bottom);
      border-top: 1px solid rgba(169, 134, 96, 0.2);
      background: rgba(255, 251, 244, 0.92);
      backdrop-filter: blur(18px);
    }

    .tab {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 12px;
      color: var(--ink-muted);
      font-size: 10px;
      line-height: 1.2;
      transition:
        color 160ms ease,
        background-color 160ms ease;
    }

    .tab:hover {
      color: var(--ink-soft);
      background: rgba(169, 80, 52, 0.045);
    }

    .tab.is-active {
      color: var(--accent);
      font-weight: 650;
    }

    .tab__icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 24px;
      border-radius: 8px;
      transition: background-color 180ms ease;
    }

    .tab.is-active .tab__icon {
      background: rgba(169, 80, 52, 0.105);
    }

    .tab__icon svg {
      width: 20px;
      height: 20px;
    }

    .tab__badge {
      position: absolute;
      top: 7px;
      left: calc(50% + 8px);
      display: grid;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      place-items: center;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--paper-bright);
      color: #fff8ee;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .sheet-layer {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: flex-end;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(53, 35, 21, 0.34);
      opacity: 0;
      transition: opacity 220ms ease;
      backdrop-filter: blur(2px);
    }

    .detail-sheet {
      position: relative;
      width: 100%;
      max-height: min(78%, 570px);
      overflow-y: auto;
      padding: 9px 20px calc(20px + var(--safe-bottom));
      border-radius: 27px 27px 0 0;
      background: linear-gradient(180deg, #fffcf7 0%, #fff9f0 100%);
      box-shadow: 0 -18px 54px rgba(55, 35, 20, 0.2);
      transform: translateY(100%);
      transition: transform 280ms var(--sheet-ease);
      scrollbar-width: none;
    }

    .detail-sheet::-webkit-scrollbar {
      display: none;
    }

    .sheet-layer.is-open .sheet-backdrop {
      opacity: 1;
    }

    .sheet-layer.is-open .detail-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      margin: 0 auto 15px;
      border-radius: 999px;
      background: #d9c3a8;
    }

    .sheet-close {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: rgba(92, 64, 39, 0.065);
      color: var(--ink-soft);
    }

    .sheet-close:hover {
      background: rgba(92, 64, 39, 0.1);
    }

    .sheet-close svg {
      width: 15px;
      height: 15px;
    }

    .sheet-kind {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f3e4cf;
      color: #7c5437;
      font-size: 9.5px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .sheet-kind--event {
      background: #e5ead8;
      color: #53613c;
    }

    .sheet-kind--ddl {
      background: #f8e3db;
      color: var(--overdue);
    }

    .sheet-title {
      max-width: calc(100% - 24px);
      margin: 8px 0 16px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 680;
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .sheet-facts {
      margin: 0 0 18px;
      padding: 1px 14px;
      border-radius: 14px;
      background: #faf3e8;
    }

    .sheet-fact {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 8px;
      padding: 11px 0;
      border-top: 1px dashed rgba(147, 111, 74, 0.18);
    }

    .sheet-fact:first-child {
      border-top: 0;
    }

    .sheet-fact dt {
      color: var(--ink-muted);
      font-size: 10.5px;
      line-height: 1.6;
    }

    .sheet-fact dd {
      margin: 0;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 550;
    }

    .sheet-primary {
      width: 100%;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(145deg, #b45a3c 0%, #9b452d 100%);
      box-shadow: 0 8px 18px rgba(129, 64, 39, 0.2);
      color: #fff8ee;
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: 0.02em;
      transition:
        transform 150ms ease,
        box-shadow 150ms ease,
        filter 150ms ease;
    }

    .sheet-primary:hover {
      filter: brightness(1.035);
      box-shadow: 0 10px 21px rgba(129, 64, 39, 0.24);
    }

    .sheet-primary:active {
      transform: scale(0.992);
    }

    .form-sheet {
      position: relative;
      width: 100%;
      max-height: min(92%, 700px);
      overflow-y: auto;
      padding: 9px 20px calc(20px + var(--safe-bottom));
      border-radius: 27px 27px 0 0;
      background: linear-gradient(180deg, #fffcf7 0%, #fff9f0 100%);
      box-shadow: 0 -18px 54px rgba(55, 35, 20, 0.2);
      transform: translateY(100%);
      transition: transform 280ms var(--sheet-ease);
      scrollbar-width: none;
    }

    .form-sheet::-webkit-scrollbar {
      display: none;
    }

    .sheet-layer.is-open .form-sheet {
      transform: translateY(0);
    }

    .form-sheet__title {
      margin: 2px 0 16px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 680;
      letter-spacing: -0.015em;
    }

    .form-types {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 18px;
      padding: 4px;
      border-radius: 14px;
      background: #f2e7d6;
    }

    .form-type {
      min-height: 38px;
      border-radius: 10px;
      color: var(--ink-muted);
      font-size: 12.5px;
      font-weight: 600;
      transition:
        background-color 160ms ease,
        color 160ms ease,
        box-shadow 160ms ease;
    }

    .form-type[aria-checked="true"] {
      background: var(--paper-bright);
      box-shadow: 0 2px 8px rgba(103, 68, 39, 0.1);
      color: var(--ink);
    }

    .form-type[data-form-type="event"][aria-checked="true"] {
      background: #e5ead8;
      color: #465433;
    }

    .form-type[data-form-type="course"][aria-checked="true"] {
      background: #f2ddbb;
      color: #684a2c;
    }

    .form-type[data-form-type="ddl"][aria-checked="true"] {
      background: #f8e3db;
      color: var(--overdue);
    }

    .form-field {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(147, 111, 74, 0.24);
      border-radius: 12px;
      background: #faf3e8;
      color: var(--ink);
      font: inherit;
      font-size: 13.5px;
      color-scheme: light;
      transition:
        border-color 150ms ease,
        box-shadow 150ms ease,
        background-color 150ms ease;
    }

    .form-input::placeholder {
      color: var(--ink-faint);
    }

    .form-input:focus {
      border-color: rgba(169, 80, 52, 0.55);
      background: var(--paper-bright);
      box-shadow: 0 0 0 3px rgba(169, 80, 52, 0.1);
      outline: none;
    }

    .form-input[aria-invalid="true"] {
      border-color: rgba(164, 61, 43, 0.55);
    }

    .form-time-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-time-row .form-input {
      flex: 1;
      min-width: 0;
    }

    .form-time-dash {
      flex: none;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .form-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .form-day {
      position: relative;
      display: flex;
      height: 48px;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 1px solid rgba(147, 111, 74, 0.16);
      border-radius: 10px;
      background: #faf3e8;
      color: var(--ink-soft);
      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        box-shadow 150ms ease;
    }

    .form-day__weekday {
      color: var(--ink-muted);
      font-size: 9.5px;
      line-height: 1;
    }

    .form-day__date {
      font-size: 10.5px;
      font-weight: 620;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .form-day[aria-checked="true"] {
      border-color: transparent;
      background: linear-gradient(180deg, #b85d3e 0%, #a74c31 100%);
      box-shadow: 0 5px 12px rgba(124, 61, 37, 0.16);
    }

    .form-day[aria-checked="true"] .form-day__weekday,
    .form-day[aria-checked="true"] .form-day__date {
      color: #fff8ee;
    }

    .form-day[aria-checked="true"] .form-day__weekday {
      opacity: 0.82;
    }

    .form-day.is-today::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .form-day[aria-checked="true"].is-today::after {
      background: #fff1df;
    }

    .form-error {
      margin: -2px 0 12px;
      color: var(--overdue);
      font-size: 11px;
      line-height: 1.5;
    }

    .schedule-block.is-new {
      z-index: 4;
    }

    .schedule-block.is-new::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 2px rgba(169, 80, 52, 0.55);
      animation: new-block-glow 1.8s ease forwards;
      pointer-events: none;
    }

    @keyframes new-block-glow {
      from {
        box-shadow: inset 0 0 0 2px rgba(169, 80, 52, 0.55);
        opacity: 1;
      }
      to {
        box-shadow: inset 0 0 0 2px rgba(169, 80, 52, 0);
        opacity: 0;
      }
    }

    .toast {
      position: absolute;
      z-index: 60;
      left: 50%;
      bottom: calc(var(--tabbar-height) + var(--safe-bottom) + 22px);
      max-width: calc(100% - 48px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(57, 40, 25, 0.93);
      box-shadow: 0 8px 24px rgba(55, 35, 20, 0.2);
      color: #fff8ee;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 9px);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes block-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes day-panel-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 560px) {
      body {
        padding: 24px;
      }

      .app {
        height: min(calc(100dvh - 48px), 880px);
        border-radius: 34px;
        box-shadow:
          0 34px 80px -24px rgba(77, 51, 30, 0.48),
          0 2px 5px rgba(77, 51, 30, 0.08);
        outline: 1px solid rgba(255, 255, 255, 0.64);
        outline-offset: -1px;
      }
    }

    @media (max-width: 370px) {
      :root {
        --time-gutter: 33px;
      }

      .schedule-block {
        left: 2px;
        right: 2px;
        padding-right: 3px;
        padding-left: 3px;
      }

      .schedule-block__title {
        font-size: 10px;
      }

      .schedule-block__location {
        font-size: 8px;
      }

      .day-ddl-panel {
        margin-right: 9px;
        margin-left: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="app-content" id="appContent">
      <header class="app-header">
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">10:39</span>
          <span class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
              <rect x="0" y="8" width="2.5" height="4" rx="1"></rect>
              <rect x="4.5" y="6" width="2.5" height="6" rx="1"></rect>
              <rect x="9" y="3" width="2.5" height="9" rx="1"></rect>
              <rect x="13.5" y="0" width="2.5" height="12" rx="1"></rect>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M1.4 3.6a10.2 10.2 0 0 1 13.2 0"></path>
              <path d="M3.9 6.4a6.5 6.5 0 0 1 8.2 0"></path>
              <path d="M6.5 9a3 3 0 0 1 3 0"></path>
              <circle cx="8" cy="11.1" r="0.75" fill="currentColor" stroke="none"></circle>
            </svg>
            <span class="battery"><span class="battery__fill"></span></span>
            <span class="battery__text">53</span>
          </span>
        </div>

        <div class="week-row">
          <svg class="week-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1" fill="currentColor"></circle>
            <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M12 2.7v2.1"></path>
              <path d="M12 19.2v2.1"></path>
              <path d="M2.7 12h2.1"></path>
              <path d="M19.2 12h2.1"></path>
              <path d="m5.4 5.4 1.5 1.5"></path>
              <path d="m17.1 17.1 1.5 1.5"></path>
              <path d="m18.6 5.4-1.5 1.5"></path>
              <path d="m6.9 17.1-1.5 1.5"></path>
            </g>
          </svg>
          <h1 class="week-title"><span>第</span><strong>6</strong><span>周</span></h1>
        </div>

        <div class="date-strip" id="dateStrip" role="group" aria-label="本周日期，点击查看当天 DDL"></div>

        <section class="day-ddl-panel" id="dayDdlPanel" aria-labelledby="dayDdlTitle" hidden>
          <div class="day-ddl-panel__head">
            <h2 class="day-ddl-panel__title" id="dayDdlTitle"></h2>
            <span class="day-ddl-panel__count" id="dayDdlCount"></span>
          </div>
          <div class="day-ddl-list" id="dayDdlList"></div>
        </section>
      </header>

      <div class="timetable-scroll" id="timetableScroll">
        <section class="timetable" aria-label="本周课表">
          <div class="time-rail" id="timeRail" aria-hidden="true"></div>
          <div class="week-grid">
            <div class="grid-lines" id="gridLines" aria-hidden="true"></div>
            <div class="week-days" id="weekDays"></div>
          </div>
        </section>
      </div>

      <section class="todo-view" id="todoView" aria-labelledby="todoTitle" hidden>
        <header class="todo-header">
          <p class="todo-eyebrow" id="todoWeekRange">第 6 周 · 10/19 – 10/25</p>
          <h1 class="todo-title" id="todoTitle">待办</h1>
          <p class="todo-summary" id="todoSummary"></p>
        </header>
        <div class="todo-scroll" id="todoScroll">
          <div class="todo-groups" id="todoGroups"></div>
          <div class="todo-empty" id="todoEmpty" hidden>
            <span class="todo-empty__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5"></circle>
                <path d="m8.2 12.3 2.6 2.6 5.2-5.6"></path>
              </svg>
            </span>
            <h2 class="todo-empty__title">本周待办已清空</h2>
            <p class="todo-empty__copy">新的截止日期随时可以加进来。</p>
            <button class="todo-empty__button" id="todoEmptyAdd" type="button">添加 DDL</button>
          </div>
        </div>
      </section>

      <button class="fab" id="addButton" type="button" aria-label="添加 DDL" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab is-active" type="button" data-tab="schedule" aria-current="page">
          <span class="tab__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.2" y="3.2" width="7.2" height="7.2" rx="2"></rect>
              <rect x="13.6" y="3.2" width="7.2" height="7.2" rx="2"></rect>
              <rect x="3.2" y="13.6" width="7.2" height="7.2" rx="2"></rect>
              <rect x="13.6" y="13.6" width="7.2" height="7.2" rx="2"></rect>
            </svg>
          </span>
          <span>课表</span>
        </button>
        <button class="tab" type="button" data-tab="todo">
          <span class="tab__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.2" y="3.8" width="15.6" height="16.4" rx="3"></rect>
              <path d="M8.2 8.4h7.6"></path>
              <path d="M8.2 12h7.6"></path>
              <path d="M8.2 15.6h4.8"></path>
            </svg>
          </span>
          <span class="tab__badge" id="todoBadge">4</span>
          <span>待办</span>
        </button>
        <button class="tab" type="button" data-tab="me">
          <span class="tab__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4"></circle>
              <path d="M4.9 20.1c.9-3.6 3.7-5.5 7.1-5.5s6.2 1.9 7.1 5.5"></path>
            </svg>
          </span>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <div class="sheet-layer" id="sheetLayer" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <section class="detail-sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">

  <script id="schedule-core">
    const DEFAULT_DAY_START = 8 * 60;
    const DEFAULT_HOUR_HEIGHT = 44;
    const DEFAULT_BLOCK_GAP = 2;

    function roundToHundredth(value) {
      return Math.round(value * 100) / 100;
    }

    function parseTimeToMinutes(time) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(time);
      if (!match) throw new RangeError(`Invalid time: ${time}`);

      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      if (hours > 23 || minutes > 59) throw new RangeError(`Invalid time: ${time}`);

      return hours * 60 + minutes;
    }

    function getBlockLayout(start, end, options = {}) {
      const dayStartMinutes = options.dayStartMinutes ?? DEFAULT_DAY_START;
      const hourHeight = options.hourHeight ?? DEFAULT_HOUR_HEIGHT;
      const gap = options.gap ?? DEFAULT_BLOCK_GAP;
      const startMinutes = parseTimeToMinutes(start);
      const endMinutes = parseTimeToMinutes(end);

      if (endMinutes <= startMinutes) {
        throw new RangeError('End time must be after start time');
      }

      return {
        top: roundToHundredth(((startMinutes - dayStartMinutes) / 60) * hourHeight),
        height: roundToHundredth(((endMinutes - startMinutes) / 60) * hourHeight - gap),
        durationMinutes: endMinutes - startMinutes,
      };
    }

    function getBlockDensity(durationMinutes) {
      if (durationMinutes < 45) return 'short';
      if (durationMinutes < 75) return 'medium';
      return 'full';
    }

    const DEFAULT_DAY_END = 21 * 60;
    const WEEKDAY_LABELS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    function snapMinutes(minutes, step = 30) {
      return Math.round(minutes / step) * step;
    }

    function minutesToTime(minutes) {
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      return `${String(hours).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
    }

    function getQuickAddRange(offsetY, options = {}) {
      const dayStartMinutes = options.dayStartMinutes ?? DEFAULT_DAY_START;
      const dayEndMinutes = options.dayEndMinutes ?? DEFAULT_DAY_END;
      const hourHeight = options.hourHeight ?? DEFAULT_HOUR_HEIGHT;
      const step = options.step ?? 30;
      const duration = options.duration ?? 60;

      const rawMinutes = dayStartMinutes + (offsetY / hourHeight) * 60;
      const latestStart = dayEndMinutes - duration;
      const startMinutes = Math.min(
        Math.max(snapMinutes(rawMinutes, step), dayStartMinutes),
        latestStart,
      );

      return {
        start: minutesToTime(startMinutes),
        end: minutesToTime(startMinutes + duration),
        startMinutes,
        endMinutes: startMinutes + duration,
      };
    }

    function getTimeRangeError(start, end, options = {}) {
      const dayStartMinutes = options.dayStartMinutes ?? DEFAULT_DAY_START;
      const dayEndMinutes = options.dayEndMinutes ?? DEFAULT_DAY_END;
      const startMinutes = parseTimeToMinutes(start);
      const endMinutes = parseTimeToMinutes(end);

      if (endMinutes <= startMinutes) return '结束时间需要晚于开始时间';
      if (startMinutes < dayStartMinutes) return '开始时间不能早于 08:00';
      if (endMinutes > dayEndMinutes) return '结束时间不能晚于 21:00';
      return '';
    }

    function findScheduleConflict(blocks, candidate) {
      const startMinutes = parseTimeToMinutes(candidate.start);
      const endMinutes = parseTimeToMinutes(candidate.end);

      return blocks.find((block) => {
        if (block.id === candidate.id) return false;
        if (block.day !== candidate.day) return false;
        const blockStart = parseTimeToMinutes(block.start);
        const blockEnd = parseTimeToMinutes(block.end);
        return startMinutes < blockEnd && endMinutes > blockStart;
      }) ?? null;
    }

    function getDdlStatus(dueDate, todayIso) {
      if (dueDate < todayIso) return 'overdue';
      if (dueDate === todayIso) return 'today';
      return 'upcoming';
    }

    function formatDdlMeta(dueDate, dueTime, todayIso) {
      const due = Date.parse(`${dueDate}T00:00:00`);
      const today = Date.parse(`${todayIso}T00:00:00`);
      const daysLate = Math.round((today - due) / 86400000);

      if (daysLate > 0) return `逾期 ${daysLate} 天`;
      if (daysLate === 0) return `今天 ${dueTime}`;
      return `${WEEKDAY_LABELS[new Date(due).getDay()]} ${dueTime}`;
    }

    function formatDueLabel(dueDate, dueTime) {
      const date = new Date(`${dueDate}T00:00:00`);
      const monthDay = `${date.getMonth() + 1}/${date.getDate()}`;
      return `${monthDay} ${WEEKDAY_LABELS[date.getDay()]} · ${dueTime}`;
    }

    function compareDdl(a, b) {
      const left = `${a.dueDate} ${a.dueTime ?? '23:59'}`;
      const right = `${b.dueDate} ${b.dueTime ?? '23:59'}`;
      return left.localeCompare(right);
    }

    function groupDdlItems(items, todayIso) {
      const groups = { overdue: [], today: [], upcoming: [] };

      items.forEach((item) => {
        groups[getDdlStatus(item.dueDate, todayIso)].push(item);
      });

      groups.overdue.sort(compareDdl);
      groups.today.sort(compareDdl);
      groups.upcoming.sort(compareDdl);
      return groups;
    }

  </script>

          const density = getBlockDensity(layout.durationMinutes);
          const button = createElement(
            'button',
            `schedule-block schedule-block--${block.kind} schedule-block--${density}`,
          );
          const title = createElement('span', 'schedule-block__title', block.title);
          const location = createElement('span', 'schedule-block__location', block.location);
          const day = MOCK_WEEK[block.day];
          const kindLabel = block.kind === 'course' ? '课程' : '日程';
          const locationText = block.location ? `，${block.location}` : '';

          button.type = 'button';
          button.dataset.blockId = block.id;
          button.style.top = `${layout.top}px`;
          button.style.height = `${layout.height}px`;
          button.style.setProperty('--order', String(index));
          button.setAttribute(
            'aria-label',
            `${kindLabel}：${block.title}，${day.weekday} ${block.start} 到 ${block.end}${locationText}。打开详情`,
          );
          button.title = `${block.title}${block.location ? ` · ${block.location}` : ''} · ${block.start}–${block.end}`;
          button.append(title);
          if (block.location) button.append(location);
          columns[block.day].append(button);
        });
      }

      function renderDdl() {
        const count = ddlItems.length;
        todoBadge.textContent = String(count);
        todoBadge.hidden = count === 0;
        const todoTab = document.querySelector('[data-tab="todo"]');
        todoTab.setAttribute('aria-label', count ? `待办，${count} 项未完成` : '待办');

        updateDayLabels();
        renderDayDdlPanel();
        renderTodo();
      }

      function renderTodo() {
        const groups = groupDdlItems(ddlItems, today.iso);
        const count = ddlItems.length;
        const overdueCount = groups.overdue.length;

        todoWeekRange.textContent =
          `第 6 周 · ${MOCK_WEEK[0].monthDay} – ${MOCK_WEEK[MOCK_WEEK.length - 1].monthDay}`;
        todoSummary.textContent = count === 0
          ? '本周没有待办'
          : overdueCount
            ? `${overdueCount} 项已逾期 · ${count - overdueCount} 项待处理`
            : `${count} 项待处理`;
        todoSummary.classList.toggle('is-overdue', overdueCount > 0);

        todoGroups.replaceChildren();
        TODO_GROUPS.forEach(({ key, label }) => {
          const items = groups[key];
          if (!items.length) return;

          const section = createElement('section', `todo-group todo-group--${key}`);
          const heading = createElement('h2', 'todo-group__heading');
          heading.id = `todoGroup-${key}`;
          section.setAttribute('aria-labelledby', heading.id);
          heading.append(
            createElement('span', '', key === 'today' ? `${label} · ${today.monthDay}` : label),
            createElement('span', 'todo-group__count', String(items.length)),
          );

          const list = createElement('ul', 'todo-list');
          items.forEach((item) => {
            const row = createElement('li', `todo-item todo-item--${item.status}`);

            const check = createElement('button', 'todo-check');
            check.type = 'button';
            check.dataset.completeDdl = item.id;
            check.setAttribute('aria-label', `完成「${item.title}」`);
            check.innerHTML = TODO_CHECK_ICON;

            const body = createElement('button', 'todo-item__body');
            body.type = 'button';
            body.dataset.ddlId = item.id;
            body.setAttribute(
              'aria-label',
              `${item.title}，${item.meta}，截止 ${item.due}。打开详情`,
            );

            const copy = createElement('span', 'todo-item__copy');
            copy.append(
              createElement('span', 'todo-item__title', item.title),
              createElement('span', 'todo-item__meta', item.meta),
            );

            const chevron = createElement('span', 'todo-item__chevron');
            chevron.setAttribute('aria-hidden', 'true');
            chevron.innerHTML = TODO_CHEVRON_ICON;

            body.append(copy, chevron);
            row.append(check, body);
            list.append(row);
          });

          section.append(heading, list);
          todoGroups.append(section);
        });

        todoGroups.hidden = count === 0;
        todoEmpty.hidden = count !== 0;
      }

      function addSheetFact(label, value) {
        const row = createElement('div', 'sheet-fact');
        const term = createElement('dt', '', label);
        const description = createElement('dd', '', value);
        row.append(term, description);
        sheetFacts.append(row);
      }

      function getFocusableElements(container) {
        return [...container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
          .filter((element) => !element.disabled && !element.hidden && element.offsetParent !== null);
      }

      function handleDialogKeydown(event, container, onEscape) {
        if (event.key === 'Escape') {
          event.preventDefault();
          onEscape();
          return;
        }
        if (event.key !== 'Tab') return;

        const focusable = getFocusableElements(container);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function handleSheetKeydown(event) {
        handleDialogKeydown(event, detailSheet, closeSheet);
      }

      function handleFormKeydown(event) {
        handleDialogKeydown(event, formSheet, () => closeFormSheet());
      }

      function openSheet({ kind, kindLabel, title, facts, primaryLabel, onPrimary }) {
        hideToast();
        const wasOpen = sheetIsOpen;
        lastFocusedElement = wasOpen ? lastFocusedElement : document.activeElement;
        sheetKind.textContent = kindLabel;
        sheetKind.className = `sheet-kind sheet-kind--${kind}`;
        sheetTitle.textContent = title;
        sheetFacts.replaceChildren();
        facts.forEach(([label, value]) => addSheetFact(label, value));
        sheetPrimary.textContent = primaryLabel;
        sheetPrimary.onclick = () => {
          if (onPrimary) onPrimary();
          else closeSheet();
        };

        if (wasOpen) return;

        sheetIsOpen = true;
        sheetLayer.hidden = false;
        sheetLayer.classList.remove('is-open');
        app.classList.add('is-sheet-open');
        appContent.inert = true;
        document.addEventListener('keydown', handleSheetKeydown);

        window.requestAnimationFrame(() => {
          sheetLayer.classList.add('is-open');
          sheetClose.focus({ preventScroll: true });
        });
      }

      function closeSheet(afterClose) {
        if (!sheetIsOpen) return;
        sheetIsOpen = false;
        closeAfterTransition = afterClose ?? null;
        sheetLayer.classList.remove('is-open');
        document.removeEventListener('keydown', handleSheetKeydown);

        const finish = () => {
          sheetLayer.hidden = true;
          app.classList.remove('is-sheet-open');
          appContent.inert = false;
          const target = lastFocusedElement
            && lastFocusedElement !== document.body
            && lastFocusedElement.isConnected
            ? lastFocusedElement
            : (document.querySelector('.tab.is-active')
              ?? document.querySelector('[data-tab="schedule"]'));
          target?.focus({ preventScroll: true });
          lastFocusedElement = null;
          const callback = closeAfterTransition;
          closeAfterTransition = null;
          callback?.();
        };

        window.setTimeout(finish, reduceMotion.matches ? 0 : 280);
      }

      function clearFormError() {
        formError.hidden = true;
        formError.textContent = '';
        formTitle.removeAttribute('aria-invalid');
      }

      function showFormError(message) {
        formError.textContent = message;
        formError.hidden = false;
      }

      function renderFormDays() {
        const chips = MOCK_WEEK.map((day, index) => {
          const chip = createElement('button', `form-day${day.isToday ? ' is-today' : ''}`);
          const weekday = createElement('span', 'form-day__weekday', day.weekday);
          const date = createElement('span', 'form-day__date', day.monthDay);

          chip.type = 'button';
          chip.dataset.formDay = String(index);
          chip.setAttribute('role', 'radio');
          chip.setAttribute('aria-checked', String(index === formDayIndex));
          chip.setAttribute('aria-label', `${day.weekday} ${day.monthDay}${day.isToday ? '，今天' : ''}`);
          chip.append(weekday, date);
          chip.addEventListener('click', () => selectFormDay(index));
          return chip;
        });

        formDays.replaceChildren(...chips);
      }

      function selectFormDay(index) {
        formDayIndex = index;
        formDays.querySelectorAll('.form-day').forEach((chip, chipIndex) => {
          chip.setAttribute('aria-checked', String(chipIndex === index));
        });
        clearFormError();
      }

      function setFormType(type) {
        formType = type;
        formTypes.querySelectorAll('.form-type').forEach((button) => {
          button.setAttribute('aria-checked', String(button.dataset.formType === type));
        });

        const isDdl = type === 'ddl';
        formSheetTitle.textContent = FORM_TYPES[type].title;
        formSubmit.textContent = FORM_TYPES[type].submit;
        formDayLabel.textContent = isDdl ? '截止日期' : '日期';
        formTimeField.hidden = isDdl;
        formDueField.hidden = !isDdl;
        formLocationField.hidden = isDdl;
        clearFormError();
      }

      function bindRadioKeys(container, selector) {
        container.addEventListener('keydown', (event) => {
          let step = 0;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') step = -1;
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') step = 1;
          if (!step) return;

          const options = [...container.querySelectorAll(selector)];
          const current = options.indexOf(document.activeElement);
          if (current === -1) return;

          event.preventDefault();
          const next = options[(current + step + options.length) % options.length];
          next.focus();
          next.click();
        });
      }

      function openFormSheet({
        type = 'event',
        dayIndex = TODAY_INDEX,
        start = '09:00',
        end = '10:00',
      } = {}) {
        if (formIsOpen) return;

        hideToast();
        formLastFocused = document.activeElement;
        formTitle.value = '';
        formLocation.value = '';
        formStart.value = start;
        formEnd.value = end;
        formDue.value = '23:59';
        formDayIndex = dayIndex;
        renderFormDays();
        setFormType(type);

        formIsOpen = true;
        formSheetLayer.hidden = false;
        formSheetLayer.classList.remove('is-open');
        app.classList.add('is-sheet-open');
        appContent.inert = true;
        document.addEventListener('keydown', handleFormKeydown);

        window.requestAnimationFrame(() => {
          formSheetLayer.classList.add('is-open');
          formTitle.focus({ preventScroll: true });
        });
      }

      function closeFormSheet(afterClose) {
        if (!formIsOpen) return;
        formIsOpen = false;
        formCloseAfterTransition = afterClose ?? null;
        formSheetLayer.classList.remove('is-open');
        document.removeEventListener('keydown', handleFormKeydown);

        const finish = () => {
          formSheetLayer.hidden = true;
          app.classList.remove('is-sheet-open');
          appContent.inert = false;
          const target = formLastFocused
            && formLastFocused !== document.body
            && formLastFocused.isConnected
            ? formLastFocused
            : activeView === 'todo'
              ? addButton
              : dateStrip.querySelector('.day-cell.is-expanded')
                ?? dateStrip.querySelector('.day-cell.is-today')
                ?? dateStrip.querySelector('.day-cell');
          target?.focus({ preventScroll: true });
          formLastFocused = null;
          const callback = formCloseAfterTransition;
          formCloseAfterTransition = null;
          callback?.();
        };

        window.setTimeout(finish, reduceMotion.matches ? 0 : 280);
      }

      function saveFormEntry() {
        const title = formTitle.value.trim();
        clearFormError();

        if (!title) {
          formTitle.setAttribute('aria-invalid', 'true');
          showFormError('给这个安排起个名字吧');
          formTitle.focus();
          return;
        }

        const day = MOCK_WEEK[formDayIndex];

        if (formType === 'ddl') {
          const dueTime = formDue.value || '23:59';
          const status = getDdlStatus(day.iso, today.iso);
          const item = {
            id: `ddl-${Date.now()}`,
            title,
            meta: formatDdlMeta(day.iso, dueTime, today.iso),
            status,
            statusLabel: status === 'overdue' ? '已逾期' : status === 'today' ? '今天到期' : '本周内',
            due: formatDueLabel(day.iso, dueTime),
            dueDate: day.iso,
            dueTime,
          };

          ddlItems = [...ddlItems, item].sort(compareDdl);
          renderDdl();
          closeFormSheet(() => {
            showToast(`已添加 DDL「${title}」`);
            let target;
            if (activeView === 'todo') {
              target = todoGroups.querySelector(`[data-ddl-id="${item.id}"]`);
            } else {
              expandedDayIso = item.dueDate;
              renderDayDdlPanel();
              updateDayLabels();
              target = dayDdlPanel.querySelector(`[data-day-ddl-id="${item.id}"]`);
            }
            target?.scrollIntoView({
              behavior: reduceMotion.matches ? 'auto' : 'smooth',
              inline: 'nearest',
              block: 'nearest',
            });
          });
          return;
        }

        const start = formStart.value;
        const end = formEnd.value;

        if (!start || !end) {
          showFormError('把开始和结束时间都填上吧');
          formStart.focus();
          return;
        }

        const timeError = getTimeRangeError(start, end);
        if (timeError) {
          showFormError(timeError);
          formStart.focus();
          return;
        }

        const conflict = findScheduleConflict(scheduleBlocks, { day: formDayIndex, start, end });
        if (conflict) {
          showFormError(`这个时间和「${conflict.title}」重叠了，换个时间吧`);
          formStart.focus();
          return;
        }

        const block = {
          id: `user-${Date.now()}`,
          day: formDayIndex,
          kind: formType === 'course' ? 'course' : 'event',
          title,
          location: formLocation.value.trim(),
          start,
          end,
        };

        scheduleBlocks.push(block);
        renderScheduleBlocks();
        closeFormSheet(() => {
          showToast(`已添加「${title}」`);
          const element = weekDays.querySelector(`[data-block-id="${block.id}"]`);
          element?.scrollIntoView({
            behavior: reduceMotion.matches ? 'auto' : 'smooth',
            block: 'nearest',
          });
          element?.classList.add('is-new');
          window.setTimeout(() => element?.classList.remove('is-new'), 1800);
        });
      }

      function formatTimeRange(block, day) {
        return `${day.weekday} ${block.start}–${block.end}`;
      }

      function openBlockSheet(block) {
        const day = MOCK_WEEK[block.day];
        const duration = parseTimeToMinutes(block.end) - parseTimeToMinutes(block.start);
        openSheet({
          kind: block.kind,
          kindLabel: block.kind === 'course' ? '课程' : '日程',
          title: block.title,
          facts: [
            ['时间', formatTimeRange(block, day)],
            ['时长', formatDuration(duration)],
            ['地点', block.location || '未填写'],
          ],
          primaryLabel: '知道了',
        });
      }

      function openDdlSheet(id) {
        const item = ddlItems.find((entry) => entry.id === id);
        if (!item) return;
        openSheet({
          kind: 'ddl',
          kindLabel: 'DDL',
          title: item.title,
          facts: [
            ['截止', item.due],
            ['状态', item.statusLabel],
          ],
          primaryLabel: '标记完成',
          onPrimary: () => completeDdl(id),
        });
      }

      function completeDdl(id) {
        const item = ddlItems.find((entry) => entry.id === id);
        if (!item) {
          closeSheet();
          return;
        }
        ddlItems = ddlItems.filter((entry) => entry.id !== id);
        renderDdl();
        const message = ddlItems.length ? `已完成「${item.title}」` : '本周 DDL 已清空，做得好。';
        closeSheet(() => showToast(message));
      }

      function completeDdlFromTodo(id, trigger) {
        const checks = [...todoGroups.querySelectorAll('[data-complete-ddl]')];
        const index = Math.max(checks.indexOf(trigger), 0);
        const item = ddlItems.find((entry) => entry.id === id);
        if (!item) return;

        ddlItems = ddlItems.filter((entry) => entry.id !== id);
        renderDdl();
        showToast(
          ddlItems.length ? `已完成「${item.title}」` : '本周待办已清空，做得好。',
        );

        const remaining = [...todoGroups.querySelectorAll('[data-complete-ddl]')];
        const next = remaining[Math.min(index, remaining.length - 1)];
        (next ?? todoEmptyAdd).focus({ preventScroll: true });
      }

      function syncTabState() {
        tabs.forEach((tab) => {
          const isActive = tab.dataset.tab === activeView;
          tab.classList.toggle('is-active', isActive);
          if (isActive) tab.setAttribute('aria-current', 'page');
          else tab.removeAttribute('aria-current');
        });
      }

      function setActiveView(view) {
        activeView = view;
        const isTodo = view === 'todo';

        hideToast();
        app.classList.toggle('is-todo', isTodo);
        timetableScroll.hidden = isTodo;
        todoView.hidden = !isTodo;
        document.title = isTodo ? '小排 · 待办' : '小排 · 第 6 周';
        addButton.hidden = !isTodo;
        syncTabState();
        if (isTodo) renderTodo();
      }

      todoGroups.addEventListener('click', (event) => {
        const check = event.target.closest('[data-complete-ddl]');
        if (check) {
          completeDdlFromTodo(check.dataset.completeDdl, check);
          return;
        }

        const row = event.target.closest('[data-ddl-id]');
        if (row) openDdlSheet(row.dataset.ddlId);
      });

      todoEmptyAdd.addEventListener('click', () => {
        openFormSheet({ type: 'ddl', dayIndex: TODAY_INDEX });
      });

      dateStrip.addEventListener('click', (event) => {
        const cell = event.target.closest('.day-cell');
        if (cell) toggleDayDdlPanel(cell.dataset.date);
      });

      dayDdlList.addEventListener('click', (event) => {
        const row = event.target.closest('[data-day-ddl-id]');
        if (row) openDdlSheet(row.dataset.dayDdlId);
      });

      weekDays.addEventListener('pointerdown', (event) => {
        gridPointerStart = { x: event.clientX, y: event.clientY };
      });

      weekDays.addEventListener('click', (event) => {
        const pointerStart = gridPointerStart;
        gridPointerStart = null;

        const blockButton = event.target.closest('.schedule-block');
        if (blockButton) {
          const block = scheduleBlocks.find((entry) => entry.id === blockButton.dataset.blockId);
          if (block) openBlockSheet(block);
          return;
        }

        const column = event.target.closest('.day-column');
        if (!column) return;

        if (pointerStart) {
          const moved = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
          if (moved > 10) return;
        }

        const range = getQuickAddRange(event.clientY - column.getBoundingClientRect().top);
        openFormSheet({
          dayIndex: Number(column.dataset.day),
          start: range.start,
          end: range.end,
        });
      });

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const name = tab.dataset.tab;
          if (name === 'me') {
            showToast('「我的」页将在后续原型中展开');
            return;
          }
          if (name === activeView) {
            showToast(name === 'schedule' ? '已经在本周课表' : '已经在待办页');
            return;
          }
          setActiveView(name);
        });
      });

      addButton.addEventListener('click', () => {
        openFormSheet({ type: 'ddl', dayIndex: TODAY_INDEX });
      });

      formTypes.addEventListener('click', (event) => {
        const button = event.target.closest('.form-type');
        if (button) setFormType(button.dataset.formType);
      });

      bindRadioKeys(formTypes, '.form-type');
      bindRadioKeys(formDays, '.form-day');

      addForm.addEventListener('submit', (event) => {
        event.preventDefault();
        saveFormEntry();
      });

      formTitle.addEventListener('input', () => {
        if (formTitle.getAttribute('aria-invalid') === 'true') {
          formTitle.removeAttribute('aria-invalid');
          clearFormError();
        }
      });

      formSheetBackdrop.addEventListener('click', () => closeFormSheet());
      formSheetClose.addEventListener('click', () => closeFormSheet());

      sheetBackdrop.addEventListener('click', () => closeSheet());
      sheetClose.addEventListener('click', () => closeSheet());

      renderDateStrip();
      renderTimeRail();
      renderGridLines();
      renderWeekDays();
      renderScheduleBlocks();
      renderDdl();
    })();
  </script>
</body>
</html>
