<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F0E4">
  <meta name="color-scheme" content="light">
  <title>小排 · 第 6 周</title>
  <style>
    :root {
      --paper: #faf6ee;
      --paper-bright: #fffbf4;
      --canvas: #e7d8c4;
      --ink: #3b2a1d;
      --ink-soft: #6f5742;
      --ink-muted: #7c634c;
      --ink-faint: #977f68;
      --line-v: rgba(143, 112, 77, 0.18);
      --line-hour: rgba(143, 112, 77, 0.24);
      --line-half: rgba(143, 112, 77, 0.12);
      --accent: #a95034;
      --accent-deep: #8c3e27;
      --accent-soft: #c47451;
      --honey: #f2ddbb;
      --honey-deep: #e7c99d;
      --sage: #dfe6d1;
      --sage-deep: #c8d4b5;
      --overdue: #a43d2b;
      --overdue-bg: #fbe9e2;
      --hour-height: 44px;
      --grid-height: 572px;
      --time-gutter: 37px;
      --tabbar-height: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sheet-ease: cubic-bezier(0.22, 0.8, 0.28, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--canvas);
      background-image:
        radial-gradient(circle at 14% 8%, rgba(255, 249, 240, 0.92), transparent 34%),
        radial-gradient(circle at 86% 88%, rgba(223, 200, 173, 0.75), transparent 38%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      margin: 0;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--paper);
    }

    .app-content {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .app-header {
      position: relative;
      z-index: 2;
      flex: none;
      background:
        radial-gradient(120% 130% at 82% -22%, rgba(255, 255, 255, 0.78), transparent 58%),
        linear-gradient(180deg, #f5e2c9 0%, #f9f0e4 60%, var(--paper) 100%);
    }

    .app-header::before {
      content: "";
      position: absolute;
      top: -76px;
      right: -24px;
      width: 210px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 236, 205, 0.84), transparent 70%);
      pointer-events: none;
    }

    .status-bar {
      position: relative;
      z-index: 1;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 21px;
      color: var(--ink);
    }

    .status-time {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.82;
    }

    .status-icons svg {
      display: block;
    }

    .battery {
      position: relative;
      width: 22px;
      height: 11px;
      padding: 1.5px;
      border: 1.2px solid currentColor;
      border-radius: 3.4px;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -3.2px;
      width: 2px;
      height: 4px;
      border-radius: 0 2px 2px 0;
      background: currentColor;
      opacity: 0.6;
    }

    .battery__fill {
      display: block;
      width: 53%;
      height: 100%;
      border-radius: 1.5px;
      background: currentColor;
    }

    .battery__text {
      margin-left: 1px;
      font-size: 9px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .week-row {
      position: relative;
      z-index: 1;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .week-sun {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      color: #bb6842;
    }

    .week-title {
      display: flex;
      align-items: baseline;
      gap: 3px;
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .week-title strong {
      font-size: 24px;
      line-height: 1;
      font-weight: 680;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .date-strip {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--time-gutter) repeat(7, minmax(0, 1fr));
      height: 54px;
    }

    .date-spacer {
      min-width: 0;
    }

    .day-cell {
      position: relative;
      display: flex;
      min-width: 0;
      margin: 1px 2px 3px;
      border-radius: 12px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: var(--ink-soft);
    }

    .day-date {
      font-size: 11px;
      font-weight: 620;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .day-weekday {
      font-size: 10px;
      line-height: 1.2;
      color: var(--ink-muted);
    }

    .day-dot {
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .day-cell.is-today {
      background: linear-gradient(180deg, #b85d3e 0%, #a74c31 100%);
      box-shadow: 0 5px 12px rgba(124, 61, 37, 0.18);
    }

    .day-cell.is-today .day-date,
    .day-cell.is-today .day-weekday {
      color: #fff8ee;
    }

    .day-cell.is-today .day-weekday {
      opacity: 0.82;
    }

    .day-cell.is-today .day-dot {
      background: #fff1df;
    }

    .ddl-card {
      position: relative;
      z-index: 1;
      flex: none;
      height: 48px;
      margin: 8px 12px;
      padding: 0 9px 0 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(169, 134, 96, 0.26);
      border-radius: 14px;
      background: rgba(255, 250, 242, 0.76);
      box-shadow: 0 8px 22px rgba(103, 68, 39, 0.055);
      backdrop-filter: blur(12px);
    }

    .ddl-heading {
      flex: none;
      display: flex;
      align-items: center;
      gap: 5px;
      padding-left: 1px;
      color: #70543d;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    .ddl-heading svg {
      width: 13px;
      height: 13px;
      color: var(--accent);
    }

    .ddl-count {
      display: grid;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      place-items: center;
      border-radius: 999px;
      background: var(--accent);
      color: #fff7ed;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .ddl-scroll-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 36px;
    }

    .ddl-scroll-area::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 14px;
      background: linear-gradient(90deg, transparent, rgba(255, 250, 242, 0.96));
      pointer-events: none;
    }

    .ddl-scroll {
      display: flex;
      gap: 6px;
      height: 100%;
      padding-right: 11px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .ddl-scroll::-webkit-scrollbar {
      display: none;
    }

    .ddl-chip {
      flex: none;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid rgba(177, 143, 105, 0.23);
      border-radius: 9px;
      background: var(--paper-bright);
      text-align: left;
      transition:
        border-color 160ms ease,
        background-color 160ms ease,
        transform 160ms ease;
    }

    .ddl-chip:hover {
      border-color: rgba(169, 80, 52, 0.3);
      background: #fffaf1;
      transform: translateY(-1px);
    }

    .ddl-chip--overdue {
      border-color: rgba(164, 61, 43, 0.18);
      background: var(--overdue-bg);
    }

    .ddl-chip__dot {
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    .ddl-chip--overdue .ddl-chip__dot {
      background: var(--overdue);
    }

    .ddl-chip--today .ddl-chip__dot {
      background: var(--accent);
    }

    .ddl-chip__copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      white-space: nowrap;
    }

    .ddl-chip__meta {
      color: var(--ink-muted);
      font-size: 9px;
      line-height: 1.15;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .ddl-chip--overdue .ddl-chip__meta {
      color: var(--overdue);
      font-weight: 650;
    }

    .ddl-chip--today .ddl-chip__meta {
      color: var(--accent);
      font-weight: 650;
    }

    .ddl-chip__title {
      max-width: 158px;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      text-overflow: ellipsis;
    }

    .ddl-empty {
      height: 100%;
      display: flex;
      align-items: center;
      color: var(--ink-muted);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .timetable-scroll {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--paper);
      scrollbar-width: none;
    }

    .timetable-scroll::-webkit-scrollbar {
      display: none;
    }

    .app.is-sheet-open .timetable-scroll {
      overflow: hidden;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-gutter) minmax(0, 1fr);
      height: var(--grid-height);
    }

    .time-rail {
      position: relative;
    }

    .time-label {
      position: absolute;
      right: 7px;
      transform: translateY(-50%);
      color: var(--ink-muted);
      font-size: 9px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .time-label--first {
      top: 4px !important;
      transform: none;
    }

    .time-label--last {
      top: calc(var(--grid-height) - 4px) !important;
      transform: translateY(-100%);
    }

    .week-grid {
      position: relative;
      height: 100%;
    }

    .grid-lines {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
    }

    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid var(--line-hour);
    }

    .grid-line--half {
      border-top-style: dashed;
      border-top-color: var(--line-half);
    }

    .week-days {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      height: 100%;
    }

    .day-column {
      position: relative;
      height: 100%;
      border-left: 1px solid var(--line-v);
    }

    .day-column:last-child {
      border-right: 1px solid var(--line-v);
    }

    .day-column.is-today {
      background: linear-gradient(180deg, rgba(244, 216, 179, 0.36), rgba(250, 246, 238, 0) 72%);
    }

    .schedule-block {
      position: absolute;
      z-index: 2;
      left: 3px;
      right: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      padding: 5px 4px;
      border: 1px solid rgba(153, 112, 66, 0.12);
      border-radius: 10px;
      background: linear-gradient(155deg, #f6e5ca 0%, #f0d8b4 100%);
      box-shadow:
        0 1px 1px rgba(98, 67, 39, 0.05),
        inset 0 1px rgba(255, 255, 255, 0.42);
      color: #4b3420;
      text-align: center;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        filter 160ms ease;
      animation: block-in 320ms both;
      animation-delay: calc(var(--order, 0) * 18ms);
    }

    .schedule-block:hover {
      z-index: 3;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(109, 73, 39, 0.14);
      filter: saturate(1.03);
    }

    .schedule-block:active {
      transform: scale(0.985);
    }

    .schedule-block--event {
      border-color: rgba(102, 123, 74, 0.14);
      background: linear-gradient(155deg, #e7edd9 0%, #dce5cc 100%);
      color: #43502f;
    }

    .schedule-block__title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: 0.005em;
      text-wrap: balance;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .schedule-block__location {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      color: rgba(86, 60, 34, 0.76);
      font-size: 9px;
      line-height: 1.18;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .schedule-block--event .schedule-block__location {
      color: rgba(63, 77, 42, 0.78);
    }

    .schedule-block--short .schedule-block__location,
    .schedule-block--medium .schedule-block__location {
      display: none;
    }

    .fab {
      position: absolute;
      z-index: 7;
      right: 18px;
      bottom: calc(var(--tabbar-height) + var(--safe-bottom) + 16px);
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #b45b3d 0%, #9a442c 100%);
      box-shadow:
        0 11px 24px rgba(124, 59, 35, 0.28),
        0 2px 4px rgba(124, 59, 35, 0.16);
      color: #fff8ee;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .fab:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 28px rgba(124, 59, 35, 0.31),
        0 3px 5px rgba(124, 59, 35, 0.16);
    }

    .fab:active {
      transform: scale(0.96);
    }

    .fab svg {
      width: 21px;
      height: 21px;
    }

    .tabbar {
      position: relative;
      z-index: 5;
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      height: calc(var(--tabbar-height) + var(--safe-bottom));
      padding: 7px 12px var(--safe-bottom);
      border-top: 1px solid rgba(169, 134, 96, 0.2);
      background: rgba(255, 251, 244, 0.92);
      backdrop-filter: blur(18px);
    }

    .tab {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 12px;
      color: var(--ink-muted);
      font-size: 10px;
      line-height: 1.2;
      transition:
        color 160ms ease,
        background-color 160ms ease;
    }

    .tab:hover {
      color: var(--ink-soft);
      background: rgba(169, 80, 52, 0.045);
    }

    .tab.is-active {
      color: var(--accent);
      font-weight: 650;
    }

    .tab__icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 24px;
      border-radius: 8px;
      transition: background-color 180ms ease;
    }

    .tab.is-active .tab__icon {
      background: rgba(169, 80, 52, 0.105);
    }

    .tab__icon svg {
      width: 20px;
      height: 20px;
    }

    .tab__badge {
      position: absolute;
      top: 7px;
      left: calc(50% + 8px);
      display: grid;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      place-items: center;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--paper-bright);
      color: #fff8ee;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .sheet-layer {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: flex-end;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(53, 35, 21, 0.34);
      opacity: 0;
      transition: opacity 220ms ease;
      backdrop-filter: blur(2px);
    }

    .detail-sheet {
      position: relative;
      width: 100%;
      max-height: min(78%, 570px);
      overflow-y: auto;
      padding: 9px 20px calc(20px + var(--safe-bottom));
      border-radius: 27px 27px 0 0;
      background: linear-gradient(180deg, #fffcf7 0%, #fff9f0 100%);
      box-shadow: 0 -18px 54px rgba(55, 35, 20, 0.2);
      transform: translateY(100%);
      transition: transform 280ms var(--sheet-ease);
      scrollbar-width: none;
    }

    .detail-sheet::-webkit-scrollbar {
      display: none;
    }

    .sheet-layer.is-open .sheet-backdrop {
      opacity: 1;
    }

    .sheet-layer.is-open .detail-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      margin: 0 auto 15px;
      border-radius: 999px;
      background: #d9c3a8;
    }

    .sheet-close {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: rgba(92, 64, 39, 0.065);
      color: var(--ink-soft);
    }

    .sheet-close:hover {
      background: rgba(92, 64, 39, 0.1);
    }

    .sheet-close svg {
      width: 15px;
      height: 15px;
    }

    .sheet-kind {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f3e4cf;
      color: #7c5437;
      font-size: 9.5px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .sheet-kind--event {
      background: #e5ead8;
      color: #53613c;
    }

    .sheet-kind--ddl {
      background: #f8e3db;
      color: var(--overdue);
    }

    .sheet-title {
      max-width: calc(100% - 24px);
      margin: 8px 0 16px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 680;
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .sheet-facts {
      margin: 0 0 18px;
      padding: 1px 14px;
      border-radius: 14px;
      background: #faf3e8;
    }

    .sheet-fact {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 8px;
      padding: 11px 0;
      border-top: 1px dashed rgba(147, 111, 74, 0.18);
    }

    .sheet-fact:first-child {
      border-top: 0;
    }

    .sheet-fact dt {
      color: var(--ink-muted);
      font-size: 10.5px;
      line-height: 1.6;
    }

    .sheet-fact dd {
      margin: 0;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 550;
    }

    .sheet-primary {
      width: 100%;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(145deg, #b45a3c 0%, #9b452d 100%);
      box-shadow: 0 8px 18px rgba(129, 64, 39, 0.2);
      color: #fff8ee;
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: 0.02em;
      transition:
        transform 150ms ease,
        box-shadow 150ms ease,
        filter 150ms ease;
    }

    .sheet-primary:hover {
      filter: brightness(1.035);
      box-shadow: 0 10px 21px rgba(129, 64, 39, 0.24);
    }

    .sheet-primary:active {
      transform: scale(0.992);
    }

    .toast {
      position: absolute;
      z-index: 60;
      left: 50%;
      bottom: calc(var(--tabbar-height) + var(--safe-bottom) + 22px);
      max-width: calc(100% - 48px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(57, 40, 25, 0.93);
      box-shadow: 0 8px 24px rgba(55, 35, 20, 0.2);
      color: #fff8ee;
      font-size: 11px;

  <script id="schedule-core">
    const DEFAULT_DAY_START = 8 * 60;
    const DEFAULT_HOUR_HEIGHT = 44;
    const DEFAULT_BLOCK_GAP = 2;

    function roundToHundredth(value) {
      return Math.round(value * 100) / 100;
    }

    function parseTimeToMinutes(time) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(time);
      if (!match) throw new RangeError(`Invalid time: ${time}`);

      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      if (hours > 23 || minutes > 59) throw new RangeError(`Invalid time: ${time}`);

      return hours * 60 + minutes;
    }

    function getBlockLayout(start, end, options = {}) {
      const dayStartMinutes = options.dayStartMinutes ?? DEFAULT_DAY_START;
      const hourHeight = options.hourHeight ?? DEFAULT_HOUR_HEIGHT;
      const gap = options.gap ?? DEFAULT_BLOCK_GAP;
      const startMinutes = parseTimeToMinutes(start);
      const endMinutes = parseTimeToMinutes(end);

      if (endMinutes <= startMinutes) {
        throw new RangeError('End time must be after start time');
      }

      return {
        top: roundToHundredth(((startMinutes - dayStartMinutes) / 60) * hourHeight),
        height: roundToHundredth(((endMinutes - startMinutes) / 60) * hourHeight - gap),
        durationMinutes: endMinutes - startMinutes,
      };
    }

    function getBlockDensity(durationMinutes) {
      if (durationMinutes < 45) return 'short';
      if (durationMinutes < 75) return 'medium';
      return 'full';
    }
  </script>

      function handleSheetKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSheet();
          return;
        }
        if (event.key !== 'Tab') return;

        const focusable = getFocusableElements();
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function openSheet({ kind, kindLabel, title, facts, primaryLabel, onPrimary }) {
        const wasOpen = sheetIsOpen;
        lastFocusedElement = wasOpen ? lastFocusedElement : document.activeElement;
        sheetKind.textContent = kindLabel;
        sheetKind.className = `sheet-kind sheet-kind--${kind}`;
        sheetTitle.textContent = title;
        sheetFacts.replaceChildren();
        facts.forEach(([label, value]) => addSheetFact(label, value));
        sheetPrimary.textContent = primaryLabel;
        sheetPrimary.onclick = () => {
          if (onPrimary) onPrimary();
          else closeSheet();
        };

        if (wasOpen) return;

        sheetIsOpen = true;
        sheetLayer.hidden = false;
        sheetLayer.classList.remove('is-open');
        app.classList.add('is-sheet-open');
        appContent.inert = true;
        document.addEventListener('keydown', handleSheetKeydown);

        window.requestAnimationFrame(() => {
          sheetLayer.classList.add('is-open');
          sheetClose.focus({ preventScroll: true });
        });
      }

      function closeSheet(afterClose) {
        if (!sheetIsOpen) return;
        sheetIsOpen = false;
        closeAfterTransition = afterClose ?? null;
        sheetLayer.classList.remove('is-open');
        document.removeEventListener('keydown', handleSheetKeydown);

        const finish = () => {
          sheetLayer.hidden = true;
          app.classList.remove('is-sheet-open');
          appContent.inert = false;
          const target = lastFocusedElement
            && lastFocusedElement !== document.body
            && lastFocusedElement.isConnected
            ? lastFocusedElement
            : document.querySelector('[data-tab="schedule"]');
          target?.focus({ preventScroll: true });
          lastFocusedElement = null;
          const callback = closeAfterTransition;
          closeAfterTransition = null;
          callback?.();
        };

        window.setTimeout(finish, reduceMotion.matches ? 0 : 280);
      }

      function formatTimeRange(block, day) {
        return `${day.weekday} ${block.start}–${block.end}`;
      }

      function openBlockSheet(block) {
        const day = MOCK_WEEK[block.day];
        const duration = parseTimeToMinutes(block.end) - parseTimeToMinutes(block.start);
        openSheet({
          kind: block.kind,
          kindLabel: block.kind === 'course' ? '课程' : '日程',
          title: block.title,
          facts: [
            ['时间', formatTimeRange(block, day)],
            ['时长', formatDuration(duration)],
            ['地点', block.location],
          ],
          primaryLabel: '知道了',
        });
      }

      function openDdlSheet(id) {
        const item = ddlItems.find((entry) => entry.id === id);
        if (!item) return;
        openSheet({
          kind: 'ddl',
          kindLabel: 'DDL',
          title: item.title,
          facts: [
            ['截止', item.due],
            ['状态', item.statusLabel],
          ],
          primaryLabel: '标记完成',
          onPrimary: () => completeDdl(id),
        });
      }

      function completeDdl(id) {
        const item = ddlItems.find((entry) => entry.id === id);
        if (!item) {
          closeSheet();
          return;
        }
        ddlItems = ddlItems.filter((entry) => entry.id !== id);
        renderDdl();
        const message = ddlItems.length ? `已完成「${item.title}」` : '本周 DDL 已清空，做得好。';
        closeSheet(() => showToast(message));
      }

      weekDays.addEventListener('click', (event) => {
        const button = event.target.closest('.schedule-block');
        if (!button) return;
        const block = scheduleBlocks.find((entry) => entry.id === button.dataset.blockId);
        if (block) openBlockSheet(block);
      });

      document.querySelectorAll('.tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          const name = tab.dataset.tab;
          if (name === 'schedule') {
            showToast('已经在本周课表');
            return;
          }
          if (name === 'todo') {
            showToast('完整的待办页将在后续原型中展开');
            return;
          }
          showToast('课表图像识别导入会放在「我的」页');
        });
      });

      document.getElementById('addButton').addEventListener('click', () => {
        showToast('添加日程或 DDL 的入口将在后续页面展开');
      });

      sheetBackdrop.addEventListener('click', () => closeSheet());
      sheetClose.addEventListener('click', () => closeSheet());

      renderDateStrip();
      renderTimeRail();
      renderGridLines();
      renderWeekDays();
      renderScheduleBlocks();
      renderDdl();
    })();
  </script>
</body>
</html>
